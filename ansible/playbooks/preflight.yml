---
- name: Validate the Tinyrack K3s server
  hosts: k3s_servers
  gather_facts: true
  become: false

  tasks:
    - name: Run K3s server preflight checks
      ansible.builtin.include_role:
        name: setup_k3s_server
        tasks_from: preflight
        apply:
          become: true

    - name: Run Cilium preflight checks
      ansible.builtin.include_role:
        name: setup_cilium
        tasks_from: preflight
        apply:
          become: true

    - name: Validate the Sealed Secrets recovery key
      ansible.builtin.include_role:
        name: restore_sealed_secrets_key
        tasks_from: preflight
        apply:
          become: true
