---
setup_cilium_version: 1.20.1
setup_cilium_release_name: cilium
setup_cilium_namespace: kube-system
setup_cilium_chart: oci://quay.io/cilium/charts/cilium
setup_cilium_kube_context: tinyrack
setup_cilium_node_name: tinyrack
setup_cilium_device: eth0
setup_cilium_values_path: "{{ playbook_dir }}/../../infrastructure/base/cilium/values.yaml"
setup_cilium_cni_config_path: /etc/cni/net.d/05-cilium.conflist
setup_cilium_flux_helm_release_name: cilium
setup_cilium_ready_timeout: 10m
setup_cilium_isolated_namespaces:
  - cert-manager-system
  - cloudflared-system
  - cnpg-system
  - discourse-system
  - flux-system
  - issuary-system
  - kyverno
  - longhorn-system
  - mariadb-operator-system
  - memos-system
  - ot-redis-operator-system
  - reflector
  - sealed-secrets
  - system-upgrade
  - tinest-relay-system
  - traefik-system
