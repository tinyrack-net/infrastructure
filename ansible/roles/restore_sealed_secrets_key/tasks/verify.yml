---
- name: Run Sealed Secrets recovery key preflight checks before verification
  ansible.builtin.import_tasks: preflight.yml

- name: Read the restored Sealed Secrets recovery key
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - get
      - secret
      - "{{ restore_sealed_secrets_key_secret_name }}"
      - --namespace
      - "{{ restore_sealed_secrets_key_namespace }}"
      - --output=json
  register: restore_sealed_secrets_key_result
  changed_when: false
  no_log: true

- name: Decode the restored Sealed Secrets recovery key
  ansible.builtin.set_fact:
    restore_sealed_secrets_key_resource: "{{ restore_sealed_secrets_key_result.stdout | from_json }}"
  no_log: true

- name: Verify the restored Sealed Secrets recovery key
  ansible.builtin.assert:
    that:
      - restore_sealed_secrets_key_resource.type == "kubernetes.io/tls"
      - >-
        restore_sealed_secrets_key_resource.metadata.labels["sealedsecrets.bitnami.com/sealed-secrets-key"]
        == "active"
      - >-
        restore_sealed_secrets_key_resource.data["tls.crt"]
        == (lookup('ansible.builtin.file', restore_sealed_secrets_key_tls_crt_path, rstrip=false) | b64encode)
      - >-
        restore_sealed_secrets_key_resource.data["tls.key"]
        == (restore_sealed_secrets_key_tls_key | b64encode)
    fail_msg: The restored Sealed Secrets recovery key does not match the Vault values.
  no_log: true
