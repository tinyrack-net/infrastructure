---
- name: Run Sealed Secrets recovery key preflight checks
  ansible.builtin.import_tasks: preflight.yml

- name: Wait for the K3s node to become ready
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - wait
      - --for=condition=Ready
      - node
      - --all
      - "--timeout={{ restore_sealed_secrets_key_ready_timeout }}"
  when: not ansible_check_mode or restore_sealed_secrets_key_k3s_executable.stat.exists
  changed_when: false
  check_mode: false

- name: Restore the missing Sealed Secrets recovery key
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - apply
      - --filename=-
    stdin: "{{ lookup('ansible.builtin.template', 'sealed-secrets-key.yaml.j2') }}"
    stdin_add_newline: false
  when:
    - not ansible_check_mode
    - >-
      not restore_sealed_secrets_key_k3s_executable.stat.exists
      or restore_sealed_secrets_key_existing_result.rc != 0
  register: restore_sealed_secrets_key_apply
  changed_when: >-
    restore_sealed_secrets_key_apply.stdout_lines
    | select('search', ' (created|configured)$')
    | list
    | length > 0
  no_log: true

- name: Report a missing recovery key in check mode
  ansible.builtin.debug:
    msg: The Sealed Secrets recovery key would be created.
  when:
    - ansible_check_mode
    - >-
      not restore_sealed_secrets_key_k3s_executable.stat.exists
      or restore_sealed_secrets_key_existing_result.rc != 0
  changed_when: true
