apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos
  namespace: memos-system
spec:
  replicas: 1
  # 서로 다른 버전이 같은 DB에 동시에 붙지 않도록 기존 파드를 먼저 내린다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: memos
  template:
    metadata:
      labels:
        app: memos
    spec:
      containers:
      - name: memos
        image: neosmemo/memos:26.11.1
        ports:
        - name: http
          containerPort: 5230
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /
            port: 5230
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 5230
          initialDelaySeconds: 15
          periodSeconds: 20
        env:
          - name: MEMOS_DRIVER
            value: "postgres"
          - name: MEMOS_INSTANCE_URL
            value: "https://notes.tinyrack.net"
          - name: MEMOS_DSN
            valueFrom:
              secretKeyRef:
                name: memos-database-dsn-secret
                key: dsn
