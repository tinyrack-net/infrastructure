apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tinest-relay
  namespace: tinest-relay-system
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: relay.tinest.tinyrack.net
      http:
        paths:
          - path: /v1/ws
            pathType: Prefix
            backend:
              service:
                name: tinest-relay
                port:
                  name: http
          - path: /health/live
            pathType: Exact
            backend:
              service:
                name: tinest-relay
                port:
                  name: http
          - path: /health/ready
            pathType: Exact
            backend:
              service:
                name: tinest-relay
                port:
                  name: http
  tls:
    - hosts:
        - relay.tinest.tinyrack.net
      secretName: letsencrypt-cert
