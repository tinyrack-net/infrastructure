apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder-relay
  namespace: coder-relay-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coder-relay
  template:
    metadata:
      labels:
        app: coder-relay
    spec:
      terminationGracePeriodSeconds: 35
      containers:
        - name: coder-relay
          image: ghcr.io/tinyrack-net/tinest-relay:v0.5.2 # {"$imagepolicy": "flux-system:coder-relay"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
