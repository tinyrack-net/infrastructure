apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: issuary-ingress
  namespace: issuary-system
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
    # Issuary serves assets uncompressed (~1.7 MB on the login page).
    traefik.ingress.kubernetes.io/router.middlewares: traefik-system-edge-compress@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: auth.tinyrack.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: issuary-service
                port:
                  name: http

  tls:
    - hosts:
        - "auth.tinyrack.net"
      secretName: letsencrypt-cert
