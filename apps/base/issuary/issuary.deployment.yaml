apiVersion: apps/v1
kind: Deployment
metadata:
  name: issuary
  namespace: issuary-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: issuary
  template:
    metadata:
      annotations:
        issuary.tinyrack.net/config-revision: remove-v1-20260825
      labels:
        app: issuary
    spec:
      containers:
        - name: issuary
          image: ghcr.io/tinyrack-net/issuary:0.23.0 # {"$imagepolicy": "flux-system:issuary"}
          imagePullPolicy: IfNotPresent
          command:
            - node
            - dist/cli.js
            - serve
            - --config-path=/config/config.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: issuary-secrets
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/issuary/database-ca/ca.crt
            - name: ISSUARY_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: issuary-database-user-secret
                  key: username
            - name: ISSUARY_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: issuary-database-user-secret
                  key: password
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          volumeMounts:
            - name: config
              mountPath: /config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: database-ca
              mountPath: /etc/issuary/database-ca
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: issuary-config
        - name: database-ca
          secret:
            secretName: issuary-database-cluster-ca
            items:
              - key: ca.crt
                path: ca.crt
