apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: tinyauth-database-backup-source
  namespace: issuary-system
spec:
  configuration:
    destinationPath: s3://tinyrack-prod/apps/tinyauth/database
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: tinyrack-s3-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: tinyrack-s3-secret
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
      maxParallel: 8
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: issuary-database-backup-store
  namespace: issuary-system
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://tinyrack-prod/apps/issuary/database
    endpointURL: https://fsn1.your-objectstorage.com
    s3Credentials:
      accessKeyId:
        name: tinyrack-s3-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: tinyrack-s3-secret
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
      maxParallel: 8
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: issuary-database-cluster
  namespace: issuary-system
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17-bookworm
  postgresql:
    parameters:
      max_connections: "500"
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 32Gi
      storageClassName: longhorn-strict-local
      volumeMode: Filesystem
  monitoring:
    enablePodMonitor: false

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: issuary-database-backup-store

  externalClusters:
    - name: tinyauth-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: tinyauth-database-backup-source
          serverName: tinyauth-database-cluster

  enableSuperuserAccess: true
  superuserSecret:
    name: issuary-database-superuser-secret

  bootstrap:
    recovery:
      source: tinyauth-source
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: issuary-backup
  namespace: issuary-system
spec:
  schedule: "0 0 */4 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: issuary-database-cluster
