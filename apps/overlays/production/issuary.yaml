apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: issuary-deployment
  namespace: flux-system
spec:
  interval: 30m0s
  path: ./apps/overlays/production/issuary/deployment
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m0s
  wait: true
  dependsOn:
    - name: load-repositories
    - name: cloudnative-pg
