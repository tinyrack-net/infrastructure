apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup-cleanup
  namespace: flux-system
spec:
  interval: 15m
  path: ./infrastructure/base/backup-cleanup
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kyverno
    - name: cloudnative-pg
    - name: longhorn
