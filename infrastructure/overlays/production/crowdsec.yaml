apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 15m
  path: ./infrastructure/base/crowdsec
  prune: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure-repositories
    - name: sealed-secrets
    - name: longhorn
    - name: network-security
    - name: prometheus-operator-crds
