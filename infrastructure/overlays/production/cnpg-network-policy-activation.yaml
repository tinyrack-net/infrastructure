apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-network-policy-activation
  namespace: flux-system
spec:
  interval: 15m
  path: ./infrastructure/base/cnpg-network-policy-activation
  prune: false
  timeout: 5m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: network-security
    - name: cloudnative-pg
