apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec-release
  namespace: crowdsec-system
spec:
  chart:
    spec:
      chart: crowdsec
      version: "0.24.3"
      sourceRef:
        kind: HelmRepository
        name: crowdsec-repository
        namespace: flux-system
  interval: 15m
  timeout: 10m
  releaseName: crowdsec
  valuesFrom:
    - kind: ConfigMap
      name: crowdsec-values
      valuesKey: values.yaml
