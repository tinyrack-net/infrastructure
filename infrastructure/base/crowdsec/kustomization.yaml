apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crowdsec.namespace.yaml
  - crowdsec.cilium-network-policy.yaml
  - crowdsec.lapi.secret.yaml
  - crowdsec.allowlist.secret.yaml
  - crowdsec.allowlist.configmap.yaml
  - crowdsec.helm-release.yaml
configMapGenerator:
  - name: crowdsec-values
    files:
      - values.yaml=crowdsec.values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
    namespace: crowdsec-system
