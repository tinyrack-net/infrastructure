apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: platform-crowdsec
  namespace: crowdsec-system
spec:
  description: CrowdSec LAPI, agents and registration jobs
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
  ingress:
    # Agents push alerts, the Traefik bouncer plugin pulls decisions.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: crowdsec-system
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-system
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring-system
            app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: "6060"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: crowdsec-system
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Registration jobs and init containers store credentials through the API server.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Hub downloads and the central API (CAPI) use public HTTPS, already allowed
    # by the isolated-namespaces clusterwide policy.
