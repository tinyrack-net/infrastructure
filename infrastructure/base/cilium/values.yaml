cluster:
  name: tinyrack
  id: 0
k8sServiceHost: 127.0.0.1
k8sServicePort: 6443
kubeProxyReplacement: true
rollOutCiliumPods: true
identityAllocationMode: crd
operator:
  replicas: 1
  prometheus:
    enabled: true
    metricsService: true
    serviceMonitor:
      enabled: true
      jobLabel: app.kubernetes.io/name
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.55.0.0/16
    clusterPoolIPv4MaskSize: 24
routingMode: tunnel
tunnelProtocol: vxlan
bpf:
  masquerade: true
egressGateway:
  enabled: false
devices: eth0
cni:
  binPath: /opt/cni/bin
  confPath: /etc/cni/net.d
  exclusive: true
  uninstall: false
policyEnforcementMode: default
hostFirewall:
  enabled: true
prometheus:
  enabled: true
  metricsService: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
    jobLabel: app.kubernetes.io/name
hubble:
  enabled: true
  relay:
    enabled: true
    service:
      type: ClusterIP
  ui:
    enabled: false
