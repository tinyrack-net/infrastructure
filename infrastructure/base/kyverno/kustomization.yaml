apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - kyverno.namespace.yaml
  - kyverno.helm-release.yaml
  - kyverno.cilium-network-policy.yaml
configMapGenerator:
  - name: kyverno-values
    namespace: kyverno
    files:
      - values.yaml=kyverno.values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
