apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-crds-release
  namespace: mariadb-operator-system
spec:
  chart:
    spec:
      chart: mariadb-operator-crds
      version: "26.6.0"
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator-repository
        namespace: flux-system
  interval: 5m
  timeout: 5m
  releaseName: mariadb-operator-crds
  install:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: mariadb-operator-crds-values
      valuesKey: values.yaml
