apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - mariadb-operator-crds.helm-release.yaml
configMapGenerator:
  - name: mariadb-operator-crds-values
    namespace: mariadb-operator-system
    files:
      - values.yaml=mariadb-operator-crds.values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
