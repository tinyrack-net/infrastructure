# CrowdSec bouncer (pinned). Downloaded from the Traefik plugin catalog at startup.
experimental:
  plugins:
    crowdsec:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.8.1
# LAPI key for the bouncer plugin (traefik.crowdsec-bouncer.secret.yaml).
volumes:
  - name: crowdsec-bouncer
    mountPath: /etc/crowdsec-bouncer
    type: secret
providers:
  kubernetesCRD:
    allowExternalNameServices: true
  kubernetesIngress:
    allowExternalNameServices: true
ports:
  # Clients connect directly (DNS-only records), so no forwarded headers are
  # trusted and HTTP is only served to redirect to HTTPS.
  # The shared protection chain (infrastructure/base/traefik-middlewares) runs
  # for every route on websecure.
  websecure:
    http:
      middlewares:
        - traefik-system-edge-crowdsec@kubernetescrd
        - traefik-system-edge-ratelimit@kubernetescrd
        - traefik-system-edge-inflight@kubernetescrd
        - traefik-system-edge-headers@kubernetescrd
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
deployment:
  replicas: 2
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
    prometheus.io/path: /metrics
accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        traceparent: keep
        # CrowdSec's bad user agent and crawler scenarios read it.
        User-Agent: keep
    queryParameters:
      defaultMode: drop
tracing:
  serviceName: traefik
  sampleRate: 0.1
  resourceAttributes:
    cluster: tinyrack
  otlp:
    enabled: true
    http:
      enabled: true
      endpoint: http://monitoring-alloy.monitoring-system.svc:4318/v1/traces
