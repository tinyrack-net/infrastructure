apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-release
  namespace: traefik-system
spec:
  chart:
    spec:
      chart: traefik
      version: '41.3.0'
      sourceRef:
        kind: HelmRepository
        name: traefik-repository
        namespace: flux-system
  interval: 5m
  timeout: 5m
  releaseName: traefik
  values:
    providers:
      kubernetesCRD: 
        allowExternalNameServices: true
      kubernetesIngress: 
        allowExternalNameServices: true
    deployment:
      replicas: 2
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    accessLog:
      enabled: true
      format: json
      fields:
        defaultMode: keep
        headers:
          defaultMode: drop
          names:
            traceparent: keep
        queryParameters:
          defaultMode: drop
    tracing:
      serviceName: traefik
      sampleRate: 0.1
      resourceAttributes:
        cluster: tinyrack
      otlp:
        enabled: true
        http:
          enabled: true
          endpoint: http://monitoring-alloy.monitoring-system.svc:4318/v1/traces
