apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: flux-system
spec:
  interval: 15m
  timeout: 5m
  releaseName: prometheus-operator-crds
  targetNamespace: flux-system
  storageNamespace: flux-system
  chart:
    spec:
      chart: prometheus-operator-crds
      version: "31.0.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-repository
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      alertmanagerconfigs: {enabled: false}
      alertmanagers: {enabled: false}
      podmonitors: {enabled: false}
      probes: {enabled: false}
      prometheusagents: {enabled: false}
      prometheuses: {enabled: false}
      prometheusrules: {enabled: false}
      scrapeconfigs: {enabled: false}
      servicemonitors: {enabled: true}
      thanosrulers: {enabled: false}
