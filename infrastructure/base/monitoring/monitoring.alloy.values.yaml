crds:
  create: false
rbac:
  clusterRules:
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["nodes/pods"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["nodes/metrics", "nodes/proxy"]
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]
    - apiGroups: ["monitoring.coreos.com"]
      resources: ["servicemonitors"]
      verbs: ["get", "list", "watch"]
controller:
  type: daemonset
  volumes:
    extra:
      - name: alloy-data
        persistentVolumeClaim:
          claimName: alloy-data
alloy:
  enableReporting: false
  storagePath: /var/lib/alloy
  envFrom:
    - secretRef:
        name: telemetry-credentials
  extraEnv:
    - name: CLUSTER_NAME
      value: tinyrack
    - name: GOMEMLIMIT
      value: 256MiB
  extraPorts:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  mounts:
    extra:
      - name: alloy-data
        mountPath: /var/lib/alloy
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  configMap:
    create: false
    name: monitoring-alloy-config
    key: config.alloy
