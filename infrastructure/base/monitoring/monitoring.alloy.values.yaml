crds:
  create: false
rbac:
  clusterRules:
    - apiGroups: [""]
      resources: ["services", "endpoints", "pods", "pods/log", "namespaces", "events"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["discovery.k8s.io"]
      resources: ["endpointslices"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["nodes/pods"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["nodes/metrics", "nodes/proxy"]
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]
    - apiGroups: ["monitoring.coreos.com"]
      resources: ["servicemonitors"]
      verbs: ["get", "list", "watch"]
controller:
  type: daemonset
  volumes:
    extra:
      - name: alloy-data
        persistentVolumeClaim:
          claimName: alloy-data
alloy:
  enableReporting: false
  storagePath: /var/lib/alloy
  envFrom:
    - secretRef:
        name: telemetry-credentials
  extraEnv:
    - name: CLUSTER_NAME
      value: tinyrack
    - name: GOMEMLIMIT
      value: 768MiB
  extraPorts:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  mounts:
    extra:
      - name: alloy-data
        mountPath: /var/lib/alloy
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  configMap:
    create: false
    name: monitoring-alloy-config
    key: config.alloy
