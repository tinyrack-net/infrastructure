apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring-kube-state-metrics
  namespace: monitoring-system
spec:
  interval: 15m
  timeout: 5m
  releaseName: monitoring-kube-state-metrics
  chart:
    spec:
      chart: kube-state-metrics
      version: "7.5.3"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community-repository
        namespace: flux-system
  values:
    prometheus:
      monitor:
        enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 192Mi
