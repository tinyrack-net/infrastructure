apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring-system
spec:
  interval: 15m
  timeout: 10m
  releaseName: monitoring-k8s
  chart:
    spec:
      chart: k8s-monitoring
      version: "4.5.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-repository
        namespace: flux-system
  values:
    cluster:
      name: tinyrack
    global:
      scrapeInterval: 30s
      scrapeTimeout: 10s
    destinations:
      telemetry:
        type: otlp
        protocol: http
        url: https://telemetry.winetree94.com
        metrics: {enabled: true, path: opentelemetry/v1/metrics}
        logs: {enabled: true, path: insert/opentelemetry/v1/logs}
        traces: {enabled: true, path: insert/opentelemetry/v1/traces}
        # Bound serialized queue bytes and split large K3s scrapes before export.
        timeout: 30s
        sendingQueue:
          enabled: true
          sizer: bytes
          queueSize: 134217728
          numConsumers: 2
        retryOnFailure:
          enabled: true
          initialInterval: 5s
          maxInterval: 30s
          maxElapsedTime: 5m
        processors:
          batch:
            size: 8192
            maxSize: 8192
            timeout: 2s
          memoryLimiter:
            enabled: true
            limit: 1536MiB
            checkInterval: 1s
          transform:
            metrics:
              datapoint:
                - 'set(attributes["job"], resource.attributes["service.name"]) where attributes["job"] == nil and resource.attributes["service.name"] != nil'
                - 'set(attributes["instance"], resource.attributes["service.instance.id"]) where attributes["instance"] == nil and resource.attributes["service.instance.id"] != nil'
                - 'set(attributes["metrics_path"], "/metrics/cadvisor") where attributes["metrics_path"] == nil and resource.attributes["service.name"] == "kubelet" and IsMatch(metric.name, "^container_")'
                - 'set(attributes["metrics_path"], "/metrics") where attributes["metrics_path"] == nil and resource.attributes["service.name"] == "kubelet" and not IsMatch(metric.name, "^container_")'
        clusterLabels: [cluster, k8s.cluster.name]
        overwriteClusterLabel: true
        auth:
          type: bearerToken
          bearerTokenKey: TELEMETRY_TOKEN
        secret:
          create: false
          name: telemetry-credentials
          namespace: monitoring-system
    clusterMetrics:
      enabled: true
      collector: alloy
      destinations: [telemetry]
      # K3s exposes one shared registry. Scrape /metrics only through kubelet.
      # Route component families without filtering any series; shared/unknown
      # families remain under kubelet. cAdvisor/resource and etcd stay separate.
      kubelet:
        jobLabel: kubelet
        metricsTuning:
          useDefaultAllowList: false
        extraMetricProcessingRules: |-
          rule {
            target_label = "metrics_path"
            replacement = "/metrics"
          }
          rule {
            source_labels = ["__name__"]
            regex = "(apiserver|apiextensions|aggregator|authentication|authorization|authenticated|workqueue|process|go|rest_client)_.*"
            target_label = "job"
            replacement = "apiserver"
          }
          rule {
            source_labels = ["__name__"]
            regex = "scheduler_.*"
            target_label = "job"
            replacement = "kube-scheduler"
          }
          rule {
            source_labels = ["__name__"]
            regex = "(cronjob_controller|job_controller|attachdetach_controller|daemonset_controller|endpoint_controller|garbagecollector_controller|horizontal_pod_autoscaler|replicaset_controller|ttl_after_finished_controller)_.*"
            target_label = "job"
            replacement = "kube-controller-manager"
          }
      kubeletResource:
        metricsTuning: {useDefaultAllowList: false}
        extraMetricProcessingRules: |-
          rule {
            target_label = "metrics_path"
            replacement = "/metrics/resource"
          }
      cadvisor:
        jobLabel: kubelet
        metricsTuning: {useDefaultAllowList: false}
        extraMetricProcessingRules: |-
          rule {
            target_label = "metrics_path"
            replacement = "/metrics/cadvisor"
          }
      apiServer: {enabled: false, jobLabel: apiserver, metricsTuning: {useDefaultAllowList: false}}
      kubeDNS: {enabled: true, jobLabel: coredns, metricsTuning: {useDefaultAllowList: false}}
      kubeControllerManager: {enabled: false}
      kubeScheduler: {enabled: false}
      kubeProxy: {enabled: false}
      kube-state-metrics: {jobLabel: kube-state-metrics, metricsTuning: {useDefaultAllowList: false}}
    hostMetrics:
      enabled: true
      collector: alloy
      destinations: [telemetry]
      linuxHosts:
        enabled: true
        source: node-exporter
        jobLabel: node-exporter
        metricsTuning: {useDefaultAllowList: false}
    podLogsViaKubernetesApi: {enabled: true, collector: alloy, destinations: [telemetry]}
    clusterEvents: {enabled: true, collector: alloy, destinations: [telemetry], jobLabel: kubernetes-events}
    applicationObservability:
      enabled: true
      collector: alloy
      destinations: [telemetry]
      receivers:
        otlp:
          http: {enabled: true}
          grpc: {enabled: false}
      metrics: {enabled: false}
      logs: {enabled: false}
      traces: {enabled: true}
      connectors:
        grafanaCloudMetrics: {enabled: false}
      processors:
        memoryLimiter: {enabled: true, limit: 1536MiB}
    prometheusOperatorObjects:
      enabled: true
      collector: alloy
      destinations: [telemetry]
      podMonitors: {enabled: false}
      probes: {enabled: false}
      scrapeConfigs: {enabled: false}
      serviceMonitors: {enabled: true}
    integrations:
      collector: alloy
      destinations: [telemetry]
      alloy:
        instances:
          - name: alloy
            jobLabel: alloy
            namespaces: [monitoring-system]
            labelSelectors: {app.kubernetes.io/name: alloy}
            metrics:
              tuning:
                includeMetrics:
                  - otelcol_exporter_queue_(size|capacity)
                  - otelcol_exporter_enqueue_failed_metric_points(_total)?
                  - otelcol_receiver_refused_metric_points(_total)?
                  - otelcol_processor_refused_metric_points(_total)?
                  - otelcol_exporter_queue_batch_send_size_(bucket|sum|count)
    selfReporting: {enabled: true, destinations: [telemetry]}
    replaceComponent:
      - type: otelcol.processor.transform
        name: telemetry_scrape_normalize
        content: |-
          error_mode = "ignore"
          metric_statements {
            context = "resource"
            statements = [
              `delete_key(attributes, "service.namespace")`,
            ]
          }
          metric_statements {
            context = "datapoint"
            statements = [
              `delete_key(attributes, "service_namespace")`,
            ]
          }
          output {
            metrics = [otelcol.processor.attributes.telemetry.input]
          }
    collectors:
      alloy:
        fullnameOverride: monitoring-alloy
        controller:
          podAnnotations:
            # Avoid hanging old scrapes during this graph transition.
            observability.tinyrack.net/otlp-pipeline: "bounded-k3s-v1"
        presets: [singleton, clustered, otel-receiver]
        includeDestinations: [telemetry]
        alloy:
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
        extraConfig: |-
          discovery.kubernetes "nodes" {
            role = "node"
          }

          discovery.relabel "etcd" {
            targets = discovery.kubernetes.nodes.targets
            rule {
              source_labels = ["__meta_kubernetes_node_address_InternalIP"]
              target_label = "__address__"
              regex = "(.+)"
              replacement = "$1:2381"
            }
            rule {
              source_labels = ["__meta_kubernetes_node_name"]
              target_label  = "instance"
            }
            rule {
              target_label = "job"
              replacement  = "etcd"
            }
          }
          prometheus.scrape "etcd" {
            targets = discovery.relabel.etcd.output
            job_name = "etcd"
            scrape_interval = "30s"
            forward_to = [otelcol.receiver.prometheus.telemetry.receiver]
          }
    telemetryServices:
      kube-state-metrics: {deploy: true}
      node-exporter: {deploy: true}
